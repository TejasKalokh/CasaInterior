services:

  # ============================================================
  # MySQL 8.0 Database
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: casa_interior_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQLDATABASE}
      MYSQL_USER: ${MYSQLUSER}
      MYSQL_PASSWORD: ${MYSQLPASSWORD}
    expose:
      - "3306"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - casa_network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================
  # Spring Boot Backend
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casa_interior_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # File Storage
      FILE_STORAGE_PATH: /app/media
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Mail (SMTP)
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # Spring Profile — "docker" enables Swagger + healthcheck actuator
      SPRING_PROFILES_ACTIVE: production
    ports:
      - "8080:8080"
    volumes:
      - ./media:/app/media
    networks:
      - casa_network

# ============================================================
# Volumes
# ============================================================
volumes:
  mysql_data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  casa_network:
    driver: bridge
