# ============================================================
# application-prod.yml — Production Profile
# Active when: SPRING_PROFILES_ACTIVE=prod  (set by Dockerfile)
# ============================================================

  # ── Datasource ─────────────────────────────────────────────
spring:

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: CasaHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # Must be false in prod — schema is pre-existing

# ── Web / Error handling ───────────────────────────────────
server:
  error:
    include-stacktrace: never       # Never leak stack traces in HTTP error responses
    include-message: never          # Never expose raw exception messages
    include-binding-errors: never

# ── Spring Boot Actuator ───────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health              # Expose ONLY health — no info, metrics, env, etc.
      base-path: /actuator
  endpoint:
    health:
      show-details: never            # Public health endpoint reveals no internals
  server:
    port: 8080                       # Same port — Nginx controls external access

# ── Swagger / OpenAPI (disabled in prod) ──────────────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.casainterior: INFO
    org.springframework.security: WARN
    org.flywaydb: WARN
    com.zaxxer.hikari: WARN
