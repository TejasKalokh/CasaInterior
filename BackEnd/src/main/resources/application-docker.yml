# ============================================================
# application-docker.yml  — Docker Compose Profile
# Active when: SPRING_PROFILES_ACTIVE=docker  (set by docker-compose.yml)
# Same as prod but with Swagger + actuator health enabled.
# ============================================================

spring:

  # ── Datasource ─────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:casa_interior_db}?useSSL=false&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CasaHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  # ── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── Server ─────────────────────────────────────────────────
server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

# ── Actuator (healthcheck used by Docker) ──────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never

# ── Swagger / OpenAPI (enabled for Docker environment) ─────
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# ── Logging ────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.casainterior: INFO
    org.flywaydb: INFO
    com.zaxxer.hikari: WARN
