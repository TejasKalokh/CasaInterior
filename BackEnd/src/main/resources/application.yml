server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ============================================================
  # JPA / Hibernate
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema — Hibernate only validates
    show-sql: false
    open-in-view: false           # Prevent lazy-loading pitfalls
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ============================================================
  # Flyway
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false    # dev: skip checksum validation for edited migrations

  # ============================================================
  # File Upload
  # ============================================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 2MB

# ============================================================
# Application-level settings
# ============================================================
app:
  jwt:
    secret: ${JWT_SECRET:c2FzYV9pbnRlcmlvcl9zZWNyZXRfa2V5XzIwMjZfcHJvZHVjdGlvbl9zYWZl}
    expiration-ms: 86400000       # 24 hours

  file:
    storage-path: ${FILE_STORAGE_PATH:./media}
    allowed-types:
      - image/jpeg
      - image/png
      - video/mp4

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

# ============================================================
# Springdoc / Swagger
# ============================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ============================================================
# Logging
# ============================================================
logging:
  level:
    com.casainterior: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
