# ==============================================================
# Nginx Reverse Proxy — Casa Interior
# Tested on: Nginx 1.24+
#
# Routing:
#   /        → Next.js  (localhost:3000)
#   /api     → Spring Boot backend (localhost:8080)
#   /media   → Spring Boot media endpoint (localhost:8080)
# ==============================================================

# ── Rate limiting zones ───────────────────────────────────────
# Protects login endpoint from brute-force. 10 req/s per IP.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/s;
# General API rate limit
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

# ── Upstream definitions ──────────────────────────────────────
upstream backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ==============================================================
# HTTP → HTTPS redirect
# ==============================================================
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com api.yourdomain.com;

    # Let's Encrypt / Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================
# HTTPS — API subdomain  (api.yourdomain.com)
# Proxies /api/** and /media/** to Spring Boot backend
# ==============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    # ── SSL (Certbot managed) ──────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── File upload size — must match Spring Boot 50MB limit ──
    client_max_body_size 50M;
    client_body_timeout  60s;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_types application/json application/javascript text/plain text/css;
    gzip_min_length 1024;

    # ── API proxy ─────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;

        # Remove internal Spring Boot error details from responses
        proxy_hide_header X-Application-Context;
    }

    # ── Login rate-limit (tighter) ────────────────────────────
    location /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Actuator health (internal only, no public exposure) ───
    location /actuator/ {
        # Block external access — Actuator health is used only by Docker
        deny all;
    }

    # ── Media files ───────────────────────────────────────────
    location /media/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Cache media aggressively — backend controls cache headers
        proxy_cache_valid  200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}

# ==============================================================
# HTTPS — Frontend  (yourdomain.com)
# Proxies all public traffic to Next.js
# ==============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com;

    # ── SSL (Certbot managed) ──────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/html application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Next.js proxy ─────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Required for Next.js HMR WebSocket (irrelevant in prod, harmless)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
    }

    # ── Next.js static assets — long cache ────────────────────
    location /_next/static/ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
